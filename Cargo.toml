[package]
name = "gloamwire"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "An async Discord Gateway and REST API library for Rust"
license = "MIT"
repository = "https://github.com/aliceblackrose/Gloamwire"
readme = "README.md"
keywords = ["discord", "gateway", "api", "async", "bot"]
categories = ["api-bindings", "asynchronous", "network-programming"]

[features]
default = [
    "transport",
    "compression-zlib",
    "compression-zstd",
    "tls-rustls-native-roots",
]
model = ["dep:bitflags", "dep:serde", "dep:serde_json", "dep:thiserror"]
transport = [
    "model",
    "dep:erltf",
    "dep:erltf_serde",
    "dep:fastrand",
    "dep:futures-util",
    "dep:reqwest",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "reqwest/charset",
    "reqwest/http2",
    "reqwest/system-proxy",
]
cache = ["transport"]
compression-zlib = ["transport", "dep:flate2"]
compression-zstd = ["transport", "dep:zstd"]
tls-rustls-native-roots = [
    "transport",
    "reqwest/rustls",
    "tokio-tungstenite/rustls-tls-native-roots",
]
tracing = ["transport", "dep:tracing"]

[dependencies]
bitflags = { version = "2", features = ["serde"], optional = true }
erltf = { version = "0.16", optional = true }
erltf_serde = { version = "0.16", features = ["elixir-interop"], optional = true }
fastrand = { version = "2", optional = true }
flate2 = { version = "1.1", optional = true }
futures-util = { version = "0.3", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "multipart", "stream"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
thiserror = { version = "2", optional = true }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"], optional = true }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"], optional = true }
tracing = { version = "0.1.44", optional = true }
zstd = { version = "0.13", optional = true }

[dev-dependencies]
proptest = "1.7"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread"] }

[[example]]
name = "gateway"
required-features = ["transport"]

[[example]]
name = "rest"
required-features = ["transport"]
