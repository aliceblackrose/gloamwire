[package]
name = "gloamwire"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "An async Discord Gateway and REST API library for Rust"
license = "MIT"
repository = "https://github.com/cybellereaper/Gloamwire"
readme = "README.md"
keywords = ["discord", "gateway", "api", "async", "bot"]
categories = ["api-bindings", "asynchronous", "network-programming"]

[dependencies]
bitflags = { version = "2", features = ["serde"] }
erltf = "0.16"
erltf_serde = { version = "0.16", features = ["elixir-interop"] }
fastrand = "2"
flate2 = "1.1"
futures-util = "0.3"
reqwest = { version = "0.13", features = ["form", "json", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
zstd = "0.13"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
