name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.98.0
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          rustup default 1.98.0
      - name: Format
        run: cargo fmt --all -- --check
      - name: Feature matrix
        env:
          RUSTFLAGS: -Dunused-imports -Ddead-code
        run: |
          cargo check --no-default-features --features model
          cargo test --lib --no-default-features --features model
          cargo check --no-default-features --features transport
          cargo test --lib --no-default-features --features transport
          cargo check --no-default-features --features transport,compression-zlib
          cargo check --no-default-features --features transport,compression-zstd
          cargo check --no-default-features --features transport,tls-rustls-native-roots
          cargo check --no-default-features --features voice
          cargo test --lib --no-default-features --features voice
          cargo check --no-default-features --features dave-davey
          cargo test --lib --no-default-features --features dave-davey
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features
      - name: Docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features
